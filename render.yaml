services:
  - type: web
    name: arb-bot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: BINANCE_API_KEY
        sync: false        # set manually in Render dashboard
      - key: BINANCE_API_SECRET
        sync: false        # set manually in Render dashboard
      - key: MEXC_API_KEY
        sync: false        # set manually in Render dashboard
      - key: MEXC_API_SECRET
        sync: false        # set manually in Render dashboard
